<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="description" content="Originates：面向实体机器人与具身智能开发者的项目工作台。整理 ROS 2、感知、规划与控制开发笔记。"><title>登录与注册 · Originates</title><link rel="stylesheet" href="/site.css"></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="/">Originates<span>.dev</span></a><a href="/">返回首页</a></div></header><main class="auth-main"><p class="eyebrow">BUILD ROBOTS. START HERE.</p><h1 id="auth-title">欢迎回来。</h1><p class="muted" id="auth-desc">登录你的机器人开发工作台。</p><div class="auth-tabs" aria-label="账户操作"><button type="button" id="mode-login" aria-pressed="true">登录</button><button type="button" id="mode-register" aria-pressed="false">邮箱注册</button></div><form id="email-form"><div class="field"><label for="email">邮箱地址</label><input id="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required><p class="hint">支持任意邮箱服务商；无需 GitHub 账户。</p></div><button class="primary full" id="email-submit" type="submit">使用通行密钥登录</button></form><p class="error" id="message" role="alert" aria-live="polite"></p><p class="hint">通行密钥使用你的设备指纹、面容或屏幕锁。浏览器与设备需要支持通行密钥；请使用自己的浏览器完成系统确认。</p><div class="divider">或者</div><a class="button full" href="/auth/github">继续使用 GitHub</a><p class="notice">邮箱目前仅作为账户标识，尚未验证归属。本站不发送验证码，不支持邮件找回；请妥善保存或同步通行密钥。GitHub 与邮箱注册的账户不会自动合并。</p><p class="hint">免费开发者预览 · 不连接真实机器人或调用付费 AI 服务</p></main><script src="/auth.js" defer></script></body></html>
