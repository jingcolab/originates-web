name: Worker tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - run: npm ci
        working-directory: cloudflare
      - run: npm test
        working-directory: cloudflare
